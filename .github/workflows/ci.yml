name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Rust CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@9b8cccef289f0b43e9bafd4af825251398900941 # v2

      - name: Cargo check
        run: cargo check --all-targets --locked --verbose

      - name: Cargo test (correctness targets)
        run: cargo test --lib --tests --locked --verbose

      - name: Cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Cargo fmt check
        run: cargo fmt -- --check

      - name: Rustdoc warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --locked

      # Criterion benches use harness=false, so cargo test --all-targets runs
      # performance workloads. Compile them here without executing them.
      - name: Compile benchmarks
        run: cargo bench --no-run --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Package verification
        run: cargo package --locked

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Cargo audit (RustSec)
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  phenotype-validate:
    name: Governance Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v4

      - name: Check governance files exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for f in AGENTS.md CODEOWNERS CONTRIBUTING.md LICENSE SECURITY.md; do
            if [ -f "$f" ]; then
              echo "✓ $f"
            else
              echo "✗ MISSING: $f"
              missing=1
            fi
          done
          exit $missing
